name: user_application
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.8.0
dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.8.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.2
  firebase_storage: ^12.2.0
  iconsax: ^0.0.8

  # 🔐 Google Sign-In
  google_sign_in: ^6.2.1

  # 🧭 موقع وخرائط
  geolocator: ^10.1.0
  flutter_map: ^6.0.0
  latlong2: ^0.9.1

  # 🧩 Utilities
  get: ^4.6.6
  image_picker: ^1.1.2
  permission_handler: ^11.3.0
  file_picker: ^8.1.2
  path_provider: ^2.1.3
  cached_network_image: ^3.3.1
  http: ^1.2.2

  # 🧠 ML Kit
  google_mlkit_text_recognition: ^0.14.0

  # 🖼️ واجهات وتصميم
  flutter_svg: ^2.2.1
  icons_plus: ^5.0.0
  cupertino_icons: ^1.0.8
  syncfusion_flutter_pdfviewer: ^31.1.3
  syncfusion_flutter_pdf: ^31.1.3
  flutter_launcher_icons: ^0.13.1
  intl: ^0.20.2
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.0.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  timezone: ^0.9.4
  url_launcher: ^6.3.2
  app_links: ^6.4.1
  flutter_chat_core: ^2.0.0
  flutter_chat_ui: ^2.0.0
  flutter_chat_types: ^3.6.2
  cloud_functions: ^5.0.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  analyzer: ^5.13.0  # This version is compatible (>=4.6.0 <6.0.0)
  patch_package: ^0.0.8

flutter:


  uses-material-design: true

  assets:
    - assets/google.png
    - assets/images/BG.jpg
    - assets/images/Quran.jpg
    - assets/icons/
    - assets/images/welcome_medicine.png

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/appicon.png"

