name: user_application
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.8.0
dependencies:
  flutter:
    sdk: flutter

  # 🔥 Firebase core packages (v3/v5 series — متناسقة)
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.2
  firebase_storage: ^12.2.0

  # 🔐 Google Sign-In
  google_sign_in: ^6.2.1

  # 🧭 موقع وخرائط
  geolocator: ^10.1.0
  flutter_map: ^6.0.0
  latlong2: ^0.9.1

  # 🧩 Utilities
  get: ^4.6.6
  image_picker: ^1.1.2
  permission_handler: ^11.3.0
  file_picker: ^8.1.2
  path_provider: ^2.1.3
  cached_network_image: ^3.3.1
  http: ^1.2.2

  # 🧠 ML Kit
  google_mlkit_text_recognition: ^0.14.0

  # 🖼️ واجهات وتصميم
  flutter_svg: ^2.2.1
  icons_plus: ^5.0.0
  cupertino_icons: ^1.0.8
  syncfusion_flutter_pdfviewer: ^31.1.3
  syncfusion_flutter_pdf: ^31.1.3
  flutter_launcher_icons: ^0.13.1
  intl: ^0.20.2


  flutter_chat_core: ^2.0.0
  flutter_chat_ui: ^2.0.0
  flutter_chat_types: ^3.6.2



dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0


flutter:


  uses-material-design: true

  assets:
    - assets/google.png
    - assets/images/BG.jpg
    - assets/images/Quran.jpg
    - assets/icons/


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/roshita.png"